name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build xai-grok-pager (release, windows-amd64)
    runs-on: windows-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bin/protoc is a DotSlash wrapper with no win32 platform entry;
      # build.rs falls back to a protoc on PATH / $PROTOC. Download the same
      # protoc version the repo pins (bin/protoc -> v29.3) for Windows.
      - name: Install protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          Invoke-WebRequest -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip' -OutFile $zip
          $dir = "$env:RUNNER_TEMP\protoc"
          Expand-Archive -Path $zip -DestinationPath $dir
          Add-Content $env:GITHUB_PATH "$dir\bin"
          Add-Content $env:GITHUB_ENV "PROTOC=$dir\bin\protoc.exe"
          & "$dir\bin\protoc.exe" --version

      # Installs the toolchain pinned by rust-toolchain.toml
      # (rustup auto-installs on override resolution).
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Caches:
      #   - ~/.cargo/registry + ~/.cargo/git (crates.io + git deps)
      #   - target/ (keyed on Cargo.lock + rust-toolchain.toml)
      #   - the rustup toolchain itself
      # Also sets CARGO_INCREMENTAL=0 to keep the target cache compact.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: grok-build-win
          # Save caches from branch pushes only (PRs still restore).
          save-if: ${{ github.event_name == 'push' }}
          # Windows artifacts are large; keep the repo cache budget sane.
          cache-all-crates: false

      - name: Build
        run: cargo build -p xai-grok-pager-bin --release

      - name: Smoke test --version
        run: ./target/release/xai-grok-pager.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-windows-amd64
          path: target/release/xai-grok-pager.exe
          compression-level: 0
          if-no-files-found: error
