name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build xai-grok-pager (release, linux-amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bin/protoc is a DotSlash wrapper (not usable on CI runners);
      # build.rs falls back to protoc from PATH / $PROTOC.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          protoc --version

      # Installs the toolchain pinned by rust-toolchain.toml
      # (rustup auto-installs on override resolution).
      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Caches:
      #   - ~/.cargo/registry + ~/.cargo/git (crates.io + git deps)
      #   - target/ (keyed on Cargo.lock + rust-toolchain.toml)
      #   - the rustup toolchain itself
      # Also sets CARGO_INCREMENTAL=0 to keep the target cache compact.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: grok-build
          # Save caches from branch pushes only (PRs still restore).
          save-if: ${{ github.event_name == 'push' }}

      - name: Build
        run: cargo build -p xai-grok-pager-bin --release

      - name: Smoke test --version
        run: ./target/release/xai-grok-pager --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-linux-amd64
          path: target/release/xai-grok-pager
          compression-level: 0
          if-no-files-found: error
