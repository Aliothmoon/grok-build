name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release igrok (windows-amd64) from tag
    runs-on: macos-latest
    timeout-minutes: 240

    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
      RANLIB_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ranlib
      CMAKE_GENERATOR: Unix Makefiles

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          brew install mingw-w64 nasm cmake
          x86_64-w64-mingw32-gcc --version | head -1

      - name: Install protoc
        run: |
          set -euxo pipefail
          arch=$(uname -m | sed 's/arm64/aarch_64/')
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-${arch}.zip"
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          echo "PROTOC=/tmp/protoc/bin/protoc" >> "$GITHUB_ENV"
          /tmp/protoc/bin/protoc --version

      - name: Install Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-gnu

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: grok-build-mingw
          save-if: ${{ github.event_name == 'push' }}
          cache-all-crates: false

      # -static: fully self-contained exe (no libgcc/libwinpthread DLL deps)
      - name: Build
        run: cargo build --target x86_64-pc-windows-gnu -p xai-grok-pager-bin --release
        env:
          RUSTFLAGS: -C link-arg=-static

      # Asset name matches the auto-updater's download pattern:
      # igrok-{version}-{platform}* with platform = {os}-{arch}.
      - name: Create GitHub release with igrok.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          ASSET="igrok-${VER}-windows-x86_64.exe"
          cp "target/x86_64-pc-windows-gnu/release/igrok.exe" "/tmp/${ASSET}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "/tmp/${ASSET}#${ASSET}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --title "igrok ${VER}" \
              --notes "igrok ${VER} — built from ${TAG} (windows-amd64, cross-compiled from macOS)." \
              --latest \
              "/tmp/${ASSET}#${ASSET}" \
              --repo "$GITHUB_REPOSITORY"
          fi
